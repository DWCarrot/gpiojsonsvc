# Rock 5B 40-pin header, generated from assets/rock5b/gpio.json.
# Keys are the GPIO function names. Power, ground, and non-GPIO pins are omitted.
# id values are GPIO indices: the integer header-pin keys in gpio.json.
# They are reserved for future occupation checks across features such as I2C.
# device paths are libgpiod chip devices; point them at mock XML files when using --mock.

[service]
socket = "/run/gpiojsonsvc/service.sock"
gpio-consumer = "svc_{id}"

[pins.gpiod]
# physical pin 3, gpio-number 139
"GPIO4_B3" = { id = 3, device = "/dev/gpiochip4", line = 11 }
